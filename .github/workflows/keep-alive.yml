name: Keep Battery Map App Alive

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  wake-up-streamlit:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright
        run: |
          npm init -y
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Ping or Wake Streamlit App
        env:
          STREAMLIT_APP_URL: https://zinc-ion-battery-map-bvpghpfevrln9egmrecfgr.streamlit.app
        run: |
          node << 'EOF'
          const { chromium } = require('playwright');

          (async () => {
            const url = process.env.STREAMLIT_APP_URL;
            console.log(`Checking status of: ${url}`);

            // Stage 1: Lightweight HTTP check
            try {
              const res = await fetch(url, { headers: { 'User-Agent': 'Mozilla/5.0' } });
              const body = await res.text();

              // If the app is awake, the HTML won't contain the hibernation sleep banner
              const isSleeping = body.includes("This app has gone to sleep") || body.includes("Yes, get this app back up!");

              if (!isSleeping && res.ok) {
                console.log("App is already awake and healthy. Lightweight ping succeeded. No browser needed!");
                process.exit(0);
              }
              console.log("App appears to be sleeping. Launching browser to wake it...");
            } catch (err) {
              console.log(`Lightweight check failed (${err.message}). Proceeding with headless browser...`);
            }

            // Stage 2: Only launch Chromium if the app is actually sleeping
            const browser = await chromium.launch({
              headless: true,
              args: ['--no-sandbox', '--disable-setuid-sandbox', '--disable-dev-shm-usage']
            });

            const context = await browser.newContext({
              viewport: { width: 1280, height: 720 },
              userAgent: 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36'
            });

            const page = await context.newPage();

            // Block images, fonts, and heavy map assets to keep RAM usage minimal
            await page.route('**/*.{png,jpg,jpeg,svg,woff,woff2,webp}', route => route.abort());

            console.log('Navigating to wake sleeping app...');
            await page.goto(url, { waitUntil: 'domcontentloaded', timeout: 60000 });

            // Click the wake button
            const wakeBtn = page.getByRole('button', { name: /Yes, get this app back up!/i });
            try {
              await wakeBtn.waitFor({ state: 'visible', timeout: 15000 });
              console.log('Detected wake button. Clicking...');
              await wakeBtn.click();
              console.log('Wake button clicked successfully.');
              await page.waitForTimeout(10000);
            } catch {
              console.log('No wake button appeared or app was already initializing.');
            }

            await browser.close();
            console.log('Done.');
          })();
          EOF
