name: Keep Streamlit App Alive

on:
  schedule:
    - cron: '0 */8 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Streamlit App
        # Removed the -L flag below to prevent redirect loops and added User-Agent to bypass bot filters
        run: curl -s -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/114.0.0.0 Safari/537.36" https://zinc-ion-battery-map-bvpghpfevrln9egmrecfgr.streamlit.app > /dev/null
